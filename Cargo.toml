[package]
name = "bkpi"
version = "0.6.1"
edition = "2024"
description = "Workspace Bitrix24 data tools for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "io-std"] }
toml = "1.1"
url = "2"

regex = "1"
futures = "0.3"
fs2 = "0.4"
tempfile = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
dialoguer = { version = "0.12", default-features = false }

[features]
default = []
standalone-ai = []

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
